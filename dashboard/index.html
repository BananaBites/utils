<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  :root {
    --bg: #0b0e14;
    --card: rgba(255, 255, 255, .035);
    --line: rgba(255, 255, 255, .09);
    --text: #d7dce5;
    --dim: #7c8699;
    --accent: #6ee7f0;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: radial-gradient(1200px 600px at 15% -10%, #16233a 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #1c1630 0%, transparent 55%), var(--bg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 22px 28px; max-width: 1200px; margin: 0 auto;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .status { color: var(--dim); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 14px; transition: .15s;
  }
  button:hover { border-color: var(--accent); color: #fff; box-shadow: 0 0 18px -6px var(--accent); }
  button:active { transform: translateY(1px); }
  main {
    max-width: 1200px; margin: 0 auto; padding: 0 28px 40px;
    display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; backdrop-filter: blur(8px); position: relative; overflow: hidden;
    animation: in .35s both;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 1px;
    background: linear-gradient(90deg, transparent, hsl(var(--hue) 80% 62% / .8), transparent);
  }
  .card.error::before { background: linear-gradient(90deg, transparent, var(--bad), transparent); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--hue) 80% 62%); box-shadow: 0 0 10px hsl(var(--hue) 80% 62%); }
  .card.error .dot { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .title { font-weight: 600; font-size: 13px; }
  .meta { margin-left: auto; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .refresh { padding: 3px 9px; font-size: 13px; border-radius: 7px; color: var(--dim); }
  pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    max-height: 260px; overflow: auto; color: #c3cad6;
  }
  pre:empty::after { content: "…"; color: var(--dim); }
  .body { min-height: 18px; }
  .busy .body { opacity: .35; }
  .card.error pre { color: #ffb0b0; }
  .big { font-size: 30px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .big small { font-size: 12px; font-weight: 500; color: var(--dim); margin-left: 7px; }
  .bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; margin: 11px 0 13px; }
  .bar i { display: block; height: 100%; border-radius: 99px; transition: width .5s ease;
    background: linear-gradient(90deg, hsl(var(--hue) 80% 55%), hsl(calc(var(--hue) + 40) 90% 65%));
    box-shadow: 0 0 12px hsl(var(--hue) 80% 60% / .6); }
  .rows { display: grid; gap: 4px; font-size: 12.5px; }
  .rows div { display: flex; justify-content: space-between; }
  .rows span { color: var(--dim); }
  .rows b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .plan { color: var(--dim); font-size: 12px; text-transform: capitalize; margin-bottom: 11px; }
  .win { margin-bottom: 12px; }
  .win:last-child { margin-bottom: 0; }
  .win .bar { margin: 6px 0 4px; }
  .rowhead { display: flex; justify-content: space-between; font-size: 12.5px; }
  .rowhead b { font-variant-numeric: tabular-nums; }
  .sub { color: var(--dim); font-size: 11px; }
  .notes { color: var(--dim); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1><span>◆</span> Dashboard</h1>
  <button id="all">Refresh all</button>
  <span class="status" id="status">loading…</span>
</header>
<main id="grid"></main>
<script>
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const cards = new Map();
const config = new Map();

const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const money = n => "$" + n.toFixed(2);
const clamp = p => Math.min(100, Math.max(0, p || 0));
const win = w => `<div class="win">
    <div class="rowhead"><span>${esc(w.label)}</span><b>${clamp(w.used_percent)}%</b></div>
    <div class="bar"><i style="width:${clamp(w.used_percent)}%"></i></div>
    <div class="sub">${[w.detail, w.resets_in && "resets in " + w.resets_in].filter(Boolean).map(esc).join(" · ")}</div>
  </div>`;

const renderers = {
  text: r => `<pre>${esc(r.output || "(no output)")}</pre>`,
  credits: r => {
    const d = JSON.parse(r.output);
    const pct = d.credits ? Math.min(100, d.used / d.credits * 100) : 0;
    return `<div class="big">${pct.toFixed(1)}%<small>used</small></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="rows">
        <div><span>used</span><b>${money(d.used)}</b></div>
        <div><span>remaining</span><b>${money(d.remaining)}</b></div>
        <div><span>today</span><b>${money(d.today)}</b></div>
      </div>`;
  },
  bars: r => {
    const d = JSON.parse(r.output);
    return (d.plan ? `<div class="plan">${esc(d.plan)} plan</div>` : "") +
      ((d.windows || []).map(win).join("") || "<pre>(no usage data)</pre>") +
      (d.notes ? `<pre class="notes">${esc(d.notes)}</pre>` : "");
  }
};

async function load() {
  const widgets = await (await fetch("/widgets")).json();
  widgets.forEach((w, i) => grid.appendChild(makeCard(w, i)));
  await Promise.all(widgets.map(w => run(w.name)));
}

function makeCard(w, i) {
  const el = document.createElement("section");
  el.className = "card";
  el.style.setProperty("--hue", (i * 47 + 165) % 360);
  el.style.animationDelay = (i * 40) + "ms";
  el.innerHTML = `<div class="head"><span class="dot"></span>
      <span class="title"></span><span class="meta"></span>
      <button class="refresh" title="Refresh">↻</button></div><div class="body"></div>`;
  el.querySelector(".title").textContent = w.title;
  el.querySelector(".refresh").onclick = () => run(w.name);
  cards.set(w.name, el);
  config.set(w.name, w);
  return el;
}

async function run(name) {
  const el = cards.get(name);
  const w = config.get(name);
  const body = el.querySelector(".body");
  el.classList.add("busy");
  try {
    const r = await (await fetch("/run?name=" + encodeURIComponent(name))).json();
    try { body.innerHTML = (renderers[w.render] || renderers.text)(r); }
    catch { body.innerHTML = renderers.text(r); }
    el.classList.toggle("error", r.code !== 0);
    el.querySelector(".meta").textContent = r.code === 0 ? r.ms + " ms" : "exit " + r.code;
  } catch (e) {
    el.classList.add("error");
    body.innerHTML = `<pre>request failed: ${esc(e)}</pre>`;
  }
  el.classList.remove("busy");
}

document.getElementById("all").onclick = async () => {
  await Promise.all([...cards.keys()].map(run));
  statusEl.textContent = "updated " + new Date().toLocaleTimeString();
};
addEventListener("keydown", e => { if (e.key === "r" && !e.metaKey && !e.ctrlKey) document.getElementById("all").click(); });
load();
</script>
</body>
</html>
